name: OWA CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_COMPOSE_FILE: docker-compose.yml

jobs:
  # ========================================
  # LINT & TEST
  # ========================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Frontend
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Deps
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Lint Frontend
        run: cd frontend && npm run lint 2>/dev/null || echo "No lint script"

      - name: Test Frontend
        run: cd frontend && npm test -- --watchAll=false --passWithNoTests 2>/dev/null || echo "No tests"

      # Backend
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Deps
        run: |
          cd backend
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest black isort flake8

      - name: Lint Backend (black, isort, flake8)
        run: |
          cd backend
          black --check .
          isort --check .
          flake8 . --max-line-length=100 --ignore=E501,W503

      - name: Test Backend
        run: |
          cd backend
          pytest -v --tb=short 2>/dev/null || echo "No tests configured"

  # ========================================
  # BUILD DOCKER IMAGES
  # ========================================
  build:
    name: Build Docker Images
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # DEPLOY TO VPS (HETZNER)
  # ========================================
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/owa

            # Pull latest images
            echo "📦 Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull

            # Stop old containers gracefully
            echo "🛑 Stopping old containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans

            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d

            # Wait for health checks
            echo "⏳ Waiting for services to be healthy..."
            sleep 15

            # Verify deployment
            echo "✅ Verifying deployment..."
            curl -sf https://owawild.com/health > /dev/null && echo "Frontend OK" || echo "Frontend FAIL"
            curl -sf https://owawild.com/api/ > /dev/null && echo "Backend OK" || echo "Backend FAIL"

            # Cleanup old images
            echo "🧹 Cleaning up..."
            docker image prune -f

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deploy successful!"
          echo "🌐 https://owawild.com"
          echo "📊 https://owawild.com/api/docs"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deploy failed!"
          # Add notification (Slack, Telegram, email) here if needed