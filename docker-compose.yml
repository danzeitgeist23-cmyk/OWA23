version: '3.8'

services:
  # MongoDB - Production ready
  mongodb:
    image: mongo:7.0
    container_name: owa-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-owa_db}
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - owa-internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: owa-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=${DB_NAME:-owa_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://owawild.com,https://www.owawild.com}
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app  # For development hot reload (remove in pure prod)
    networks:
      - owa-internal
      - owa-external
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: owa-frontend
    restart: unless-stopped
    networks:
      - owa-external
    depends_on:
      - backend
    # In production, nginx handles routing; backend accessed via nginx proxy

  # Nginx Reverse Proxy (SSL termination, routing)
  nginx:
    image: nginx:alpine
    container_name: owa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - nginx_cache:/var/cache/nginx
      - letsencrypt:/etc/letsencrypt
    networks:
      - owa-external
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot:latest
    container_name: owa-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./frontend/build:/usr/share/nginx/html
    networks:
      - owa-external
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  nginx_cache:
    driver: local
  letsencrypt:
    driver: local

networks:
  owa-internal:
    driver: bridge
    internal: true  # No external access
  owa-external:
    driver: bridge